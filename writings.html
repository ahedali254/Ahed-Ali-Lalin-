<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>গল্প, কবিতা ও উপন্যাস - Ahad Ali Lelin</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #050b14;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 80px auto 40px auto;
        }
        .post-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 240, 255, 0.2);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .post-tag {
            background: #00f0ff;
            color: #000;
            padding: 3px 10px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 10px;
        }
        .post-title {
            color: #00f0ff;
            margin-top: 0;
            font-size: 24px;
        }
        .post-date {
            font-size: 12px;
            color: #888;
            margin-bottom: 15px;
        }
        .post-content {
            line-height: 1.8;
            white-space: pre-line;
            color: #dddddd;
            font-size: 16px;
        }
        .back-btn {
            display: inline-block;
            padding: 10px 20px;
            background: #00f0ff;
            color: #000;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> হোম পেজে ফিরে যান</a>
        <h1 style="text-align: center; margin-bottom: 40px; color: #00f0ff;">আমার লেখালেখি (গল্প, কবিতা ও উপন্যাস)</h1>
        
        <div id="writings-list"></div>
    </div>

    <script>
        // গুগল শিট থেকে লেখা লোড করার স্ক্রিপ্ট
        const sheetURL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTk6CgDb4ZCxPwCz_BabUsMhY6jz_q4U18JTvMTtJwgiScnLwEENQNYAa6qg5O9R5DvO_d2yl6uqG7f/pub?gid=WRITINGS_TAB_ID&single=true&output=csv';

        fetch(sheetURL)
            .then(response => response.text())
            .then(data => {
                const rows = data.split('\n').slice(1);
                const container = document.getElementById('writings-list');
                
                rows.forEach(row => {
                    const cols = row.split(',');
                    if (cols.length >= 4) {
                        const title = cols[0] ? cols[0].trim() : '';
                        const category = cols[1] ? cols[1].trim() : 'অন্যান্য';
                        const date = cols[2] ? cols[2].trim() : '';
                        const content = cols[3] ? cols[3].trim().replace(/^"|"$/g, '') : '';

                        if (title) {
                            const postHTML = `
                                <div class="post-card">
                                    <span class="post-tag">${category}</span>
                                    <h2 class="post-title">${title}</h2>
                                    <div class="post-date"><i class="fa-regular fa-calendar"></i> ${date}</div>
                                    <div class="post-content">${content}</div>
                                </div>
                            `;
                            container.innerHTML += postHTML;
                        }
                    }
                });
            })
            .catch(err => console.error("Error loading writings:", err));
    </script>
</body>
</html>
