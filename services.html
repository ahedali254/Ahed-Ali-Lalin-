<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Services - Ahad Ali Lelin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #050b14; color: #fff; overflow-x: hidden; line-height: 1.6; }
        #bg-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; background-color: #050b14; pointer-events: none; }
        
        /* Header & Navigation */
        .header { position: fixed; top: 0; left: 0; width: 100%; padding: 1rem 7%; background: rgba(5, 11, 20, 0.85); backdrop-filter: blur(12px); display: flex; justify-content: space-between; align-items: center; z-index: 100; border-bottom: 1px solid rgba(0, 240, 255, 0.15); }
        .logo { font-size: 2rem; color: #fff; text-decoration: none; font-weight: 700; letter-spacing: 0.5px; }
        .logo span { color: #00f0ff; text-shadow: 0 0 10px rgba(0, 240, 255, 0.5); }
        .navbar { display: flex; align-items: center; gap: 2rem; }
        .navbar a { font-size: 1.05rem; color: #e0e0e0; text-decoration: none; font-weight: 500; transition: all 0.3s ease; position: relative; }
        .navbar a::after { content: ''; position: absolute; bottom: -5px; left: 0; width: 0%; height: 2px; background: #00f0ff; transition: 0.3s ease; box-shadow: 0 0 8px #00f0ff; }
        .navbar a:hover::after, .navbar a.active::after { width: 100%; }
        .navbar a:hover, .navbar a.active { color: #00f0ff; }
        
        /* Main Section */
        section { min-height: 100vh; padding: 8rem 7% 5rem; max-width: 1300px; margin: 0 auto; }
        .heading { font-size: 2.5rem; text-align: center; margin-bottom: 0.8rem; font-weight: 700; }
        .heading span { color: #00f0ff; text-shadow: 0 0 15px rgba(0, 240, 255, 0.3); }
        .sub-heading { text-align: center; color: #a0aec0; margin-bottom: 3.5rem; font-size: 1.05rem; }

        /* Services Grid Layout */
        .services-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 2rem; }
        
        .services-box { 
            background: rgba(255, 255, 255, 0.025); 
            backdrop-filter: blur(10px);
            padding: 2.5rem 1.8rem; 
            border-radius: 16px; 
            text-align: left; 
            border: 1px solid rgba(0, 240, 255, 0.12); 
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
        }

        .services-box::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 240, 255, 0.08), transparent);
            transition: 0.6s ease;
        }

        .services-box:hover::before { left: 100%; }

        .services-box:hover { 
            border-color: rgba(0, 240, 255, 0.5); 
            transform: translateY(-10px) scale(1.02); 
            box-shadow: 0 15px 35px rgba(0, 240, 255, 0.2); 
            background: rgba(0, 240, 255, 0.04); 
        }
        
        .icon-wrapper {
            width: 65px;
            height: 65px;
            background: rgba(0, 240, 255, 0.08);
            border: 1px solid rgba(0, 240, 255, 0.3);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.5rem;
            transition: 0.4s ease;
        }

        .services-box:hover .icon-wrapper {
            background: #00f0ff;
            box-shadow: 0 0 20px #00f0ff;
            transform: rotateY(180deg);
        }

        .services-box i { font-size: 2rem; color: #00f0ff; transition: 0.4s ease; }
        .services-box:hover .icon-wrapper i { color: #050b14; text-shadow: none; }
        
        .services-box h3 { font-size: 1.35rem; margin-bottom: 0.8rem; color: #fff; }
        .services-box p { color: #a0aec0; font-size: 0.95rem; margin-bottom: 1.2rem; line-height: 1.6; }
        
        .feature-list { list-style: none; padding: 0; margin-bottom: 1.5rem; }
        .feature-list li { font-size: 0.88rem; color: #d1d5db; margin-bottom: 0.5rem; display: flex; align-items: center; gap: 0.5rem; }
        .feature-list li i { font-size: 0.75rem; color: #00f0ff; text-shadow: none; }

        .card-link {
            color: #00f0ff;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            transition: 0.3s ease;
        }
        .card-link i { font-size: 0.85rem; }
        .card-link:hover { gap: 0.8rem; color: #fff; text-shadow: 0 0 8px #00f0ff; }

        /* Footer Section */
        .footer { 
            background: rgba(5, 11, 20, 0.95); 
            border-top: 1px solid rgba(0, 240, 255, 0.15); 
            padding: 2rem 7%; 
        }
        
        .footer-content { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            max-width: 1100px; 
            margin: 0 auto; 
            flex-wrap: wrap; 
            gap: 1.5rem; 
        }
        
        .footer-text { color: #e0e0e0; font-size: 0.95rem; }
        .footer-text span { color: #00f0ff; }
        
        .footer-socials { display: flex; gap: 1.2rem; }
        .footer-socials a { 
            display: inline-flex; 
            justify-content: center; 
            align-items: center; 
            width: 40px; 
            height: 40px; 
            background: rgba(255, 255, 255, 0.05); 
            border: 1px solid rgba(0, 240, 255, 0.3); 
            border-radius: 50%; 
            color: #00f0ff; 
            font-size: 1.1rem; 
            text-decoration: none; 
            transition: all 0.3s ease; 
        }
        
        .footer-socials a:hover { 
            background: #00f0ff; 
            color: #050b14; 
            box-shadow: 0 0 15px #00f0ff; 
            transform: translateY(-4px) scale(1.1); 
        }

        @media (max-width: 991px) { .header { padding: 1rem 4%; } section { padding: 6rem 4% 3rem; } }
        @media (max-width: 768px) { .navbar { display: none; } .footer-content { flex-direction: column; text-align: center; } }
    </style>
</head>
